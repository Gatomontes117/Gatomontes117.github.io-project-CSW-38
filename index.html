<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Game</title>
<style>
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: #2b2250;
  }

  .launch-btn {
    font-size: 1.6rem;
    color: #fff;
    background: #28a745;
    padding: 18px 44px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    /* Slight overshoot easing gives a "pop" while staying smooth */
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .35s ease,
                background .35s ease,
                color .35s ease;
  }

  .launch-btn:focus-visible {
    outline: 3px solid #ffd23f;
    outline-offset: 4px;
  }

  @media (hover: hover) {
    .launch-btn:hover {
      background: #ffd23f;
      color: #222;
      transform: scale(1.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, .5);
    }
  }

  .launch-btn:active {
    transform: scale(0.95);
    background: #e6b800;
    color: #222;
    box-shadow: inset 0 4px 10px rgba(0, 0, 0, .4);
  }
</style>
</head>
<body>
  <button class="launch-btn" id="launchBtn">Launch game</button>

<script>
  const GAME_URL = "https://example.com/game117";

  document.getElementById("launchBtn").addEventListener("click", () => {
    window.open(GAME_URL, "_blank", "noopener");
  });
</script>
</body>
</html>
